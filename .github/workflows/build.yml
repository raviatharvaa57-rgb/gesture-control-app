name: Build Executables

on:
  workflow_dispatch: # Allows manual trigger from GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller opencv-python mediapipe pyautogui pynput

    - name: Build Windows Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed --collect-all mediapipe --collect-all cv2 --name "GestureControl" mac_scanner.py

    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GestureControl-Windows
        path: dist/GestureControl/