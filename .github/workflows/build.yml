name: Build Executables

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller opencv-python mediapipe pyautogui pynput psutil

    - name: Build Windows Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "HealthScanner" mac_scanner.py

    - name: Compress Build Folder
      run: |
        powershell Compress-Archive -Path dist/HealthScanner/* -DestinationPath dist/HealthScanner-Windows.zip

    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Build
        files: dist/HealthScanner-Windows.zip
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}