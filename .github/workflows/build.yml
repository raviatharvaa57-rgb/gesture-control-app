name: Build Executables

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: HealthScanner-Windows.zip
            build_cmd: |
              pyinstaller --noconfirm --onedir --windowed --name "HealthScanner" mac_scanner.py
              powershell Compress-Archive -Path dist/HealthScanner/* -DestinationPath dist/HealthScanner-Windows.zip
          - os: macos-latest
            artifact_name: HealthScanner-macOS.zip
            build_cmd: |
              pyinstaller --noconfirm --onedir --windowed --name "HealthScanner" mac_scanner.py
              cd dist && zip -r HealthScanner-macOS.zip HealthScanner.app

    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller opencv-python mediapipe pyautogui pynput psutil

    - name: Build Executable
      run: ${{ matrix.build_cmd }}

    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest Build
        files: dist/${{ matrix.artifact_name }}
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}